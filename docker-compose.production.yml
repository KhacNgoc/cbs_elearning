# Apply behind an HTTPS reverse proxy on the host. See DEPLOYMENT.md.
services:
  # Apart from the HTTPS reverse proxy only PostgreSQL is reachable from outside (POSTGRES_PUBLISH_ADDRESS /
  # POSTGRES_PUBLISH_PORT, password login); every other service listens on loopback.
  backend:
    ports: !override
      - "127.0.0.1:9000:8080"
    environment:
      JWT_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
  frontend:
    build:
      args:
        VITE_API_URL: ""
    ports: !override
      - "127.0.0.1:5173:80"
  rag-service:
    ports: !override
      - "127.0.0.1:8001:8001"
  qdrant:
    ports: !override
      - "127.0.0.1:6333:6333"
  ollama:
    ports: !override
      - "127.0.0.1:11434:11434"
  loki:
    ports: !override
      - "127.0.0.1:3100:3100"
  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
