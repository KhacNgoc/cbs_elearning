server:
  port: 0
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:access;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
  sql:
    init:
      mode: never
app:
  jwt:
    secret: access-test-secret-at-least-32-bytes-long-for-hmac
    expiration-ms: 3600000
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origins: http://localhost
  data-initializer:
    enabled: false
  rag-url: http://localhost:1
  upload-directory: /tmp/coretraining-access-tests-rag
