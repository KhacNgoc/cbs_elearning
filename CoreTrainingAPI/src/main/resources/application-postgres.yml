spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coretraining}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      # Hibernate already manages the PostgreSQL schema through ddl-auto.
      # Running schema.sql as well can fail on existing tables/constraints
      # before EntityManagerFactory is created.
      mode: never
