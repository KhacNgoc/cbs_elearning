spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Every request, even /api/auth/csrf, loads the user from the DB. With the default
      # 30s connection-timeout a starved pool freezes the whole UI; fail fast instead.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      # Logs the stack of any connection held longer than this, to find the next holder.
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:20000}
      # The large report statements exceed the planner's JIT threshold and spent 1.7s of 2.1s compiling;
      # compiling never pays for itself in this application's queries.
      connection-init-sql: SET jit = off
  flyway:
    enabled: true
    # A database that predates Flyway is marked as already at V1 instead of running it.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that it matches the entities.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      # Flyway manages the PostgreSQL schema.
      # Running schema.sql as well can fail on existing tables/constraints
      # before EntityManagerFactory is created.
      mode: never
