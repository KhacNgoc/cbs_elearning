server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: ${SPRING_APPLICATION_NAME}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:510MB}

app:
  password-reset:
    from: ${SMTP_FROM:no-reply@localhost}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
    cookie-secure: ${JWT_COOKIE_SECURE}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  data-initializer:
    enabled: ${DATA_INITIALIZER_ENABLED}
    admin-password: ${INITIAL_ADMIN_PASSWORD:123@qwe}
  storage:
    documents-directory: ${DOCUMENT_STORAGE_PATH}
    videos-directory: ${VIDEO_STORAGE_PATH}
    ffprobe-command: ${FFPROBE_COMMAND:ffprobe}
    video-probe-timeout-seconds: ${VIDEO_PROBE_TIMEOUT_SECONDS:30}
  video-access:
    secret: ${VIDEO_ACCESS_SECRET}
    duration-seconds: ${VIDEO_ACCESS_DURATION_SECONDS}

  rag-url: ${APP_RAG_URL}
  rag:
    recent-message-limit: ${RAG_RECENT_MESSAGE_LIMIT}
    recent-character-limit: ${RAG_RECENT_CHARACTER_LIMIT}
    summary-message-threshold: ${RAG_SUMMARY_MESSAGE_THRESHOLD}
    summary-character-threshold: ${RAG_SUMMARY_CHARACTER_THRESHOLD}
    connect-timeout-ms: ${RAG_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${RAG_READ_TIMEOUT_MS}
    quiz-read-timeout-ms: ${RAG_QUIZ_READ_TIMEOUT_MS:300000}
    quiz-max-questions: ${QUIZ_MAX_QUESTIONS:10}
    summary-timeout-ms: ${RAG_SUMMARY_TIMEOUT_MS:10000}
  upload-directory: ${APP_UPLOAD_DIRECTORY}
