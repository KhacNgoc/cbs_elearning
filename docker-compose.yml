services:
  postgres:
    image: postgres:15-alpine
    container_name: coretraining-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: coretraining-db-ide
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:?OLLAMA_HOST is required}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:?OLLAMA_CHAT_MODEL is required}
      OLLAMA_QUIZ_MODEL: ${OLLAMA_QUIZ_MODEL:?OLLAMA_QUIZ_MODEL is required}
      OLLAMA_REWRITE_MODEL: ${OLLAMA_REWRITE_MODEL:?OLLAMA_REWRITE_MODEL is required}
      OLLAMA_SUMMARY_MODEL: ${OLLAMA_SUMMARY_MODEL:?OLLAMA_SUMMARY_MODEL is required}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:?OLLAMA_EMBEDDING_MODEL is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ollama pull "$$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_QUIZ_MODEL"
        ollama pull "$$OLLAMA_REWRITE_MODEL"
        ollama pull "$$OLLAMA_SUMMARY_MODEL"
        ollama pull "$$OLLAMA_EMBEDDING_MODEL"
    restart: "no"

  rag-service:
    build: ./rag-service
    environment:
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      OLLAMA_URL: ${OLLAMA_URL:?OLLAMA_URL is required}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:?OLLAMA_CHAT_MODEL is required}
      OLLAMA_QUIZ_MODEL: ${OLLAMA_QUIZ_MODEL:?OLLAMA_QUIZ_MODEL is required}
      OLLAMA_REWRITE_MODEL: ${OLLAMA_REWRITE_MODEL:?OLLAMA_REWRITE_MODEL is required}
      OLLAMA_SUMMARY_MODEL: ${OLLAMA_SUMMARY_MODEL:?OLLAMA_SUMMARY_MODEL is required}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:?OLLAMA_EMBEDDING_MODEL is required}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:?EMBEDDING_BATCH_SIZE is required}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:?RAG_SCORE_THRESHOLD is required}
      RAG_TOP_K: ${RAG_TOP_K:?RAG_TOP_K is required}
      RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:?RAG_CANDIDATE_LIMIT is required}
      RAG_CONTEXT_MAX_CHARS: ${RAG_CONTEXT_MAX_CHARS:?RAG_CONTEXT_MAX_CHARS is required}
      RAG_COURSE_SUMMARY_TOP_K: ${RAG_COURSE_SUMMARY_TOP_K:-5}
      RAG_COURSE_SUMMARY_CONTEXT_MAX_CHARS: ${RAG_COURSE_SUMMARY_CONTEXT_MAX_CHARS:-6500}
      RAG_COURSE_SUMMARY_NUM_PREDICT: ${RAG_COURSE_SUMMARY_NUM_PREDICT:-256}
      OLLAMA_CHAT_TIMEOUT_SECONDS: ${OLLAMA_CHAT_TIMEOUT_SECONDS:?OLLAMA_CHAT_TIMEOUT_SECONDS is required}
      OLLAMA_QUIZ_GENERATION_TIMEOUT_SECONDS: ${OLLAMA_QUIZ_GENERATION_TIMEOUT_SECONDS:-120}
      OLLAMA_QUIZ_VERIFICATION_TIMEOUT_SECONDS: ${OLLAMA_QUIZ_VERIFICATION_TIMEOUT_SECONDS:-60}
      QUIZ_LLM_VERIFICATION_ENABLED: ${QUIZ_LLM_VERIFICATION_ENABLED:-false}
      QUIZ_RETRIEVAL_LIMIT: ${QUIZ_RETRIEVAL_LIMIT:-5}
      QUIZ_RETRIEVAL_CANDIDATE_LIMIT: ${QUIZ_RETRIEVAL_CANDIDATE_LIMIT:-12}
      QUIZ_CONTEXT_MAX_CHARS: ${QUIZ_CONTEXT_MAX_CHARS:-5000}
      QUIZ_SOURCE_MAX_CHARS: ${QUIZ_SOURCE_MAX_CHARS:-650}
      QUIZ_GENERATION_CONCURRENCY: ${QUIZ_GENERATION_CONCURRENCY:-2}
      QUIZ_GENERATION_MAX_ATTEMPTS: ${QUIZ_GENERATION_MAX_ATTEMPTS:-2}
      QUIZ_NUM_CTX: ${QUIZ_NUM_CTX:-2048}
      QUIZ_SINGLE_NUM_PREDICT: ${QUIZ_SINGLE_NUM_PREDICT:-180}
      QUIZ_MULTIPLE_NUM_PREDICT: ${QUIZ_MULTIPLE_NUM_PREDICT:-220}
      OLLAMA_REWRITE_TIMEOUT_SECONDS: ${OLLAMA_REWRITE_TIMEOUT_SECONDS:?OLLAMA_REWRITE_TIMEOUT_SECONDS is required}
      OLLAMA_QUERY_EMBEDDING_TIMEOUT_SECONDS: ${OLLAMA_QUERY_EMBEDDING_TIMEOUT_SECONDS:?OLLAMA_QUERY_EMBEDDING_TIMEOUT_SECONDS is required}
      OLLAMA_SUMMARY_TIMEOUT_SECONDS: ${OLLAMA_SUMMARY_TIMEOUT_SECONDS:?OLLAMA_SUMMARY_TIMEOUT_SECONDS is required}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_CHAT_NUM_PREDICT: ${OLLAMA_CHAT_NUM_PREDICT:-192}
      OLLAMA_REWRITE_NUM_PREDICT: ${OLLAMA_REWRITE_NUM_PREDICT:-96}
      OLLAMA_SUMMARY_NUM_PREDICT: ${OLLAMA_SUMMARY_NUM_PREDICT:-192}
    ports:
      - "8001:8001"
    depends_on:
      qdrant:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: ./CoreTrainingAPI
      dockerfile: Dockerfile
    container_name: cbs-elearning-backend
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:?SERVER_PORT is required}
      SERVER_SERVLET_CONTEXT_PATH: ${SERVER_SERVLET_CONTEXT_PATH:?SERVER_SERVLET_CONTEXT_PATH is required}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:?SPRING_APPLICATION_NAME is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:?MAX_UPLOAD_SIZE is required}
      MAX_UPLOAD_REQUEST_SIZE: ${MAX_UPLOAD_REQUEST_SIZE:-510MB}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:?DOCUMENT_STORAGE_PATH is required}
      VIDEO_STORAGE_PATH: ${VIDEO_STORAGE_PATH:?VIDEO_STORAGE_PATH is required}
      VIDEO_ACCESS_SECRET: ${VIDEO_ACCESS_SECRET:?VIDEO_ACCESS_SECRET is required}
      VIDEO_ACCESS_DURATION_SECONDS: ${VIDEO_ACCESS_DURATION_SECONDS:?VIDEO_ACCESS_DURATION_SECONDS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:?JWT_EXPIRATION_MS is required}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:?JWT_COOKIE_SECURE is required}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:?JWT_COOKIE_SAME_SITE is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      DATA_INITIALIZER_ENABLED: ${DATA_INITIALIZER_ENABLED:?DATA_INITIALIZER_ENABLED is required}
      APP_RAG_URL: ${APP_RAG_URL:?APP_RAG_URL is required}
      RAG_RECENT_MESSAGE_LIMIT: ${RAG_RECENT_MESSAGE_LIMIT:?RAG_RECENT_MESSAGE_LIMIT is required}
      RAG_RECENT_CHARACTER_LIMIT: ${RAG_RECENT_CHARACTER_LIMIT:?RAG_RECENT_CHARACTER_LIMIT is required}
      RAG_SUMMARY_MESSAGE_THRESHOLD: ${RAG_SUMMARY_MESSAGE_THRESHOLD:?RAG_SUMMARY_MESSAGE_THRESHOLD is required}
      RAG_SUMMARY_CHARACTER_THRESHOLD: ${RAG_SUMMARY_CHARACTER_THRESHOLD:?RAG_SUMMARY_CHARACTER_THRESHOLD is required}
      RAG_CONNECT_TIMEOUT_MS: ${RAG_CONNECT_TIMEOUT_MS:?RAG_CONNECT_TIMEOUT_MS is required}
      RAG_READ_TIMEOUT_MS: ${RAG_READ_TIMEOUT_MS:?RAG_READ_TIMEOUT_MS is required}
      RAG_QUIZ_READ_TIMEOUT_MS: ${RAG_QUIZ_READ_TIMEOUT_MS:-300000}
      RAG_SUMMARY_TIMEOUT_MS: ${RAG_SUMMARY_TIMEOUT_MS:-10000}
      APP_UPLOAD_DIRECTORY: ${APP_UPLOAD_DIRECTORY:?APP_UPLOAD_DIRECTORY is required}
      LOG_PATH: ${LOG_PATH:?LOG_PATH is required}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
    volumes:
      - training_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./CoreTraining
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:?VITE_USE_MOCK_API is required}
        VITE_RAG_CHAT_TIMEOUT_MS: ${VITE_RAG_CHAT_TIMEOUT_MS:?VITE_RAG_CHAT_TIMEOUT_MS is required}
        VITE_QUIZ_GENERATION_TIMEOUT_MS: ${VITE_QUIZ_GENERATION_TIMEOUT_MS:-300000}
        VITE_VIDEO_UPLOAD_TIMEOUT_MS: ${VITE_VIDEO_UPLOAD_TIMEOUT_MS:-1800000}
        VITE_VIDEO_MAX_UPLOAD_BYTES: ${VITE_VIDEO_MAX_UPLOAD_BYTES:-524288000}
    container_name: cbs-elearning-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - training_uploads:/srv/uploads:ro
    restart: always

volumes:
  postgres_data:
  pgadmin_data:
  training_uploads:
  qdrant_data:
  ollama_data:
