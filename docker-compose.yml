services:
  postgres:
    image: postgres:15-alpine
    container_name: coretraining-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: coretraining
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coretraining"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: coretraining-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command: "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull $$OLLAMA_CHAT_MODEL; ollama pull $$OLLAMA_EMBEDDING_MODEL"
    restart: "no"

  rag-service:
    build: ./rag-service
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

  backend:
    build:
      context: ./CoreTrainingAPI
      dockerfile: Dockerfile
    container_name: cbs-elearning-backend
    ports:
      - "8000:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coretraining
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      DOCUMENT_STORAGE_PATH: /app/uploads/documents
      VIDEO_STORAGE_PATH: /app/uploads/videos
      VIDEO_ACCESS_SECRET: ${VIDEO_ACCESS_SECRET:-change-this-video-signing-secret-before-production-2026}
      VIDEO_ACCESS_DURATION_SECONDS: ${VIDEO_ACCESS_DURATION_SECONDS:-3600}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-before-production-at-least-64-characters-long}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_RAG_URL: http://rag-service:8001
      APP_UPLOAD_DIRECTORY: /app/uploads
    volumes:
      - training_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./CoreTraining
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: cbs-elearning-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - training_uploads:/srv/uploads:ro
    restart: always

volumes:
  postgres_data:
  pgadmin_data:
  training_uploads:
  qdrant_data:
  ollama_data:
