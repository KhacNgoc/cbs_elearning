# HTTPS cho S3 API của Garage. restic -> https://<máy-chủ>:3900 -> garage:3900
server {
    listen 3900 ssl;

    ssl_certificate     /certs/public.crt;
    ssl_certificate_key /certs/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # restic gửi pack ~16 MiB; không giới hạn và không đệm để không ghi tạm ra đĩa.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://garage:3900;
        # Chữ ký S3 (SigV4) gồm cả Host: phải chuyển nguyên Host kèm cổng.
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
