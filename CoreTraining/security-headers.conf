# Included in the server block and in every location that sets its own add_header,
# because nginx drops inherited add_header directives as soon as a location declares one.
# Browsers ignore HSTS over plain HTTP and for IP-address hosts; it takes effect once
# the site is served over HTTPS from a domain name.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
