# The outer HTTPS proxy must overwrite X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# Signed video URLs must not be written to access logs.
log_format without_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;
    client_max_body_size 510m;
    access_log /var/log/nginx/access.log without_query;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Accel-Supported true;
        proxy_read_timeout 300s;
    }

    location = /api/admin/videos/upload {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_body_timeout 1800s;
    }

    location ^~ /uploads/videos/ {
        return 403;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Must exceed the backend's stale-session cutoff (up to ~75s) so the backend closes dead sockets.
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # The backend only checks access, then hands the file to /_protected_documents/.
    location /uploads/documents/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Accel-Supported true;
        proxy_read_timeout 60s;
    }

    location /_protected_documents/ {
        internal;
        alias /srv/uploads/documents/;
        sendfile on;
        tcp_nopush on;
        # ETag/If-None-Match and Range come from nginx's static file handling.
        # Must match ProtectedDocumentController.CACHE: revalidate on every use so access is rechecked.
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /_protected_videos/ {
        internal;
        alias /srv/uploads/videos/;
        sendfile on;
        aio threads;
        directio 8m;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-store" always;
    }

    # Vite assets are content-hashed and can be cached permanently. HTML must
    # never be reused without revalidation, otherwise a deployment can keep an
    # old JavaScript bundle with stale API timeout values in the browser.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
