server {
    listen 80;
    server_name localhost;
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Accel-Supported true;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /uploads/documents/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /_protected_videos/ {
        internal;
        alias /srv/uploads/videos/;
        sendfile on;
        aio threads;
        directio 8m;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-store" always;
    }

    # Vite assets are content-hashed and can be cached permanently. HTML must
    # never be reused without revalidation, otherwise a deployment can keep an
    # old JavaScript bundle with stale API timeout values in the browser.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
