# The outer HTTPS proxy must overwrite X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# Signed video URLs must not be written to access logs.
log_format without_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 510m;
    access_log /var/log/nginx/access.log without_query;

    # API JSON and the app bundle shrink several times when compressed; video and documents are skipped.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Accel-Supported true;
        proxy_read_timeout 300s;
    }

    location = /api/admin/videos/upload {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_body_timeout 1800s;
    }

    location ^~ /uploads/videos/ {
        return 403;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Must exceed the backend's stale-session cutoff (up to ~75s) so the backend closes dead sockets.
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # The backend only checks access, then hands the file to /_protected_documents/.
    location /uploads/documents/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Accel-Supported true;
        proxy_read_timeout 60s;
    }

    location /_protected_documents/ {
        internal;
        alias /srv/uploads/documents/;
        sendfile on;
        tcp_nopush on;
        # ETag/If-None-Match and Range come from nginx's static file handling.
        # Must match ProtectedDocumentController.CACHE: revalidate on every use so access is rechecked.
        add_header Cache-Control "private, no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /_protected_videos/ {
        internal;
        alias /srv/uploads/videos/;
        sendfile on;
        aio threads;
        directio 8m;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite assets are content-hashed and can be cached permanently. HTML must
    # never be reused without revalidation, otherwise a deployment can keep an
    # old JavaScript bundle with stale API timeout values in the browser.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        # YouTube lessons need its iframe API script and player frames; PDF.js needs wasm and a
        # same-origin worker; document previews inject <style> tags, hence 'unsafe-inline' for styles only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
